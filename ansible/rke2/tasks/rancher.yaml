- name: Create cattle-system namespace manifest
  ansible.builtin.copy:
    dest: /var/lib/rancher/rke2/server/manifests/cattle-system-ns.yaml
    content: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: cattle-system
    mode: '0644'
  when:
    - inventory_hostname == groups[rke2_servers_group_name].0
    - rke2_rancher_enabled | bool 
    - not rke2_uninstall | bool

- name: Create CertManager HelmChart manifest
  ansible.builtin.copy:
    dest: /var/lib/rancher/rke2/server/manifests/cert-manager.yaml
    content: |
      apiVersion: helm.cattle.io/v1
      kind: HelmChart
      metadata:
        name: cert-manager
        namespace: kube-system
      spec:
        chart: cert-manager
        repo: https://charts.jetstack.io
        version: v1.11.0
        targetNamespace: cattle-system
        createNamespace: true
        bootstrap: true
        set:
          installCRDs: "true"             
    mode: '0644'
  when:
    - inventory_hostname == groups[rke2_servers_group_name].0  
    - rke2_rancher_enabled | bool 
    - not rke2_uninstall | bool

- name: Create Rancher HelmChart manifest
  ansible.builtin.copy:
    dest: /var/lib/rancher/rke2/server/manifests/rancher.yaml
    content: |
      apiVersion: helm.cattle.io/v1
      kind: HelmChart
      metadata:
        name: rancher
        namespace: kube-system
      spec:
        chart: rancher
        repo: https://releases.rancher.com/server-charts/latest
        version: v2.14.0
        targetNamespace: cattle-system
        createNamespace: true
        bootstrap: true
        valuesContent: |- 
          hostname: "rancher.local.barque.io"
          serverURL: "https://rancher.local.barque.io"
          networkExposure:
            type: "ingress"
          service:
            type: LoadBalancer
          replicas: 1
          bootstrapPassword: "admin"            
    mode: '0644'
  when:
    - inventory_hostname == groups[rke2_servers_group_name].0  
    - rke2_rancher_enabled | bool 
    - not rke2_uninstall | bool
