- name: Create IstioGateway HelmChart manifest
  ansible.builtin.copy:
    dest: /var/lib/rancher/rke2/server/manifests/istio-gateway.yaml
    content: |
      apiVersion: helm.cattle.io/v1
      kind: HelmChart
      metadata:
        name: istio-ingress
        namespace: kube-system
      spec:
        chart: gateway
        repo: https://istio-release.storage.googleapis.com/charts
        version: 1.29.1
        targetNamespace: istio-ingress
        createNamespace: true
        bootstrap: true
        valuesContent: |-
          service:
            type: LoadBalancer
          annotations:
            kube-vip.io/loadbalancerIPs: "192.168.1.53"  
    mode: '0644'
  when:
    - inventory_hostname == groups[rke2_servers_group_name].0  
    - rke2_istio_enabled | bool 
    - not rke2_uninstall | bool
