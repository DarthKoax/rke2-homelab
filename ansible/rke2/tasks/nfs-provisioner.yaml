- name: nfs-provisioner-chart
  ansible.builtin.copy:
    dest: /var/lib/rancher/rke2/server/manifests/nfs-provisioner.yaml
    content: |
      apiVersion: helm.cattle.io/v1
      kind: HelmChart
      metadata:
        name: nfs-subdir-external-provisioner
        namespace: kube-system
      spec:
        chart: nfs-subdir-external-provisioner
        version: 4.0.18
        repo: https://kubernetes-sigs.github.io/nfs-subdir-external-provisioner/
        targetNamespace: kube-system
        valuesContent: |-
          nfs:
            server: 192.168.1.101
            path: /mnt/user/rke2_persistance
          storageClass:
            defaultClass: true
  when:
  - inventory_hostname == groups[rke2_servers_group_name].0
  - rke2_nfs_provisioner_enabled | bool 
  - not rke2_uninstall | bool
